[project]
name = "paper-radar"
version = "0.1.0"
description = "Collect, archive and deliver paper rankings"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "beautifulsoup4>=4.13,<5", "python-dotenv>=1,<2", "tzdata>=2025.1"]

[project.scripts]
paper-radar = "paper_radar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11", "mypy>=1.15", "types-beautifulsoup4"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
